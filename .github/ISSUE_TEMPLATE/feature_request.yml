name: Feature request
description: Suggest something new.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      placeholder: "A short paragraph is fine."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      placeholder: "Why is this worth the maintenance cost? What does it unlock?"
  - type: textarea
    id: alternative
    attributes:
      label: Workarounds you've already tried
      placeholder: "Existing settings, other tools, etc."
